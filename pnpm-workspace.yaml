packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@swc/core': true
  core-js: true
  esbuild: true
  sharp: true
  workerd: true

overrides:
  react: ^19.3.0
  react-dom: ^19.3.0
  # Exact pins, not ranges: two copies of @types/react make React's RefCallback
  # nominally distinct ("two different types with this name exist"), which breaks
  # the demo apps' type-check against the built d.ts.
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  react-hook-form: 7.91.0
  'qs@<6.16.1': '>=6.16.1'
  'minimatch@<3.1.3': '>=3.1.3'
  'rollup@>=4.0.0 <4.59.0': '>=4.59.0'
  'minimatch@<3.1.4': '>=3.1.4'
  'serialize-javascript@<7.1.3': '>=7.1.3'
  'ajv@<6.14.0': '>=6.14.0'
  'ajv@>=7.0.0-alpha.0 <8.18.0': '>=8.18.0'
  'svgo@>=3.0.0 <3.3.3': '>=3.3.3'
  'undici@>=6.0.0 <6.29.1': '>=6.29.1 <7'
  'undici@>=7.0.0 <7.30.1': '>=7.30.1 <8'
  'undici@>=8.0.0 <8.12.2': '>=8.12.2 <9'
  'vite@>=7.0.0 <=7.3.1': '>=7.3.2'
  '@babel/plugin-transform-modules-systemjs@>=7.12.0 <=7.29.3': '>=7.29.4'
  'brace-expansion@>=4.0.0 <5.0.5': '>=5.0.5'
  'brace-expansion@<1.1.17': '>=1.1.17 <2'
  'brace-expansion@>=2.0.0 <2.1.3': '>=2.1.3 <3'
  'picomatch@<2.3.2': '>=2.3.2'
  'picomatch@>=4.0.0 <4.0.4': '>=4.0.4'
  picomatch: 4.0.4
  'postcss@<8.5.10': '>=8.5.10'
  'follow-redirects@<=1.15.11': '>=1.16.0'
  'lodash@<=4.17.23': '>=4.18.0'
  'path-to-regexp@0.1.12': 0.1.13
  'fast-uri@>=3.0.0 <3.1.9': '>=3.1.9 <4'
  'body-parser@<1.20.9': '>=1.20.9 <2'
  'picomatch@4.0.3': 4.0.4
  'esbuild@<0.28.1': '>=0.28.1'
  'ws@>=8.0.0 <8.21.0': '>=8.21.0'
