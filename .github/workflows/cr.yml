name: Continuous Release

# npm Trusted Publishing is bound to this file name (cr.yml) and to the `npm`
# environment. Renaming either breaks publishing until npm is updated.
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "beta"

permissions: {}

# Runs are never cancelled midway. A publish cut short leaves packages on npm
# without their tags and releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# The release jobs install without the dependency cache or install scripts,
# so neither a poisoned cache nor a dependency's script runs with release
# permissions.
jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: false
          ignore-scripts: true

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Open the Version Packages PR
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: false
          ignore-scripts: true

      - name: Version packages
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # GH_TOKEN is a personal token. GitHub doesn't run workflows on PRs
          # opened with the workflow token, so CI would skip this PR.
          github-token: ${{ secrets.GH_TOKEN }}

  pack:
    name: Pack
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: false
          ignore-scripts: true

      # changeset pack doesn't build, and the lib has no prepack script.
      - name: Build
        run: pnpm --filter=use-mask-input build

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    environment:
      name: "npm"
      url: "https://npmjs.com/package/use-mask-input"
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: false
          ignore-scripts: true

      - name: Publish packages
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          # Releases created with the workflow token don't trigger the docs deploy.
          github-token: ${{ secrets.GH_TOKEN }}
