name: CD - Docs

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (optional, default: main)"
        required: false

permissions:
  contents: read

jobs:
  deploy:
    environment:
      name: "docs"
      url: "https://use-mask-input.eduardoborges.dev"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/turbo
            .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build Documentation
        run: pnpm run build --filter=docs

      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy apps/docussaurus/build --project-name=use-mask-input
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
