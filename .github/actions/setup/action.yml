name: Setup
description: Install the toolchain from mise.toml and the workspace dependencies

inputs:
  cache:
    description: Restore the mise tools and node_modules from the cache, and save them after a fresh install.
    default: 'true'
  ignore-scripts:
    description: Install without running lifecycle scripts.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        install: true
        cache: ${{ inputs.cache }}

    - name: Restore dependencies
      if: inputs.cache == 'true'
      id: pnpm-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          **/node_modules
        key: ${{ runner.os }}-pnpm-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}-${{ hashFiles('**/package.json', '!node_modules/**') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}
          ${{ runner.os }}-pnpm-

    - name: Install dependencies
      if: steps.pnpm-cache.outputs.cache-hit != 'true'
      run: pnpm install --frozen-lockfile ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
      shell: bash

    - name: Cache dependencies
      if: inputs.cache == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          **/node_modules
        key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
